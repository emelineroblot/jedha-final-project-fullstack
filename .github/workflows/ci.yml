name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qualite:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app scripts tests

      - name: Tests unitaires
        run: pytest -q

      # Les tests ne touchent ni la base ni les modèles : ils vérifient les
      # constantes, les conversions d'unités et la cohérence app ↔ ETL, qui
      # sont précisément les points où des régressions silencieuses passaient.
